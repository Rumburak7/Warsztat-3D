<!doctype html>
<!-- Warsztat 3D - autor Adam Bryks 2026 -->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warsztat 3D</title>
<meta name="author" content="Adam Bryks">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#142630">
<style>
/* Uklad: pasek u gory, po lewej szablony, w srodku podglad 3D, po prawej wymiary i pliki STL */
:root{
  color-scheme:light;
  --bg:#e6ecef; --panel:#f7f9fa; --panel2:#ebf0f3; --ink:#142630; --ink2:#46596a; --ink3:#748694;
  --line:#cdd7dd; --accent:#c98a3a; --accent2:#0a7f90; --accent-ink:#ffffff; --accent-soft:rgba(201,138,58,.14);
  --good:#1f7a3a; --warn:#a8480a; --warn-bg:#fbeadb; --danger:#b3261e; --view:#dfe6ea;
  --shadow:0 1px 2px rgba(20,38,48,.10),0 8px 24px rgba(20,38,48,.12);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --head:'Barlow Condensed','Arial Narrow','Segoe UI',Arial,sans-serif;
  --mono:'IBM Plex Mono',Consolas,'Courier New',monospace;
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0c1419; --panel:#141e25; --panel2:#1b2731; --ink:#e3ecf1; --ink2:#a6b7c2; --ink3:#73879a;
    --line:#27363f; --accent:#e5a85a; --accent2:#3cc4d6; --accent-ink:#1b1206; --accent-soft:rgba(229,168,90,.16);
    --good:#5cc27a; --warn:#f0a15c; --warn-bg:#33231a; --danger:#ff8a80; --view:#18232b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c1419; --panel:#141e25; --panel2:#1b2731; --ink:#e3ecf1; --ink2:#a6b7c2; --ink3:#73879a;
    --line:#27363f; --accent:#e5a85a; --accent2:#3cc4d6; --accent-ink:#1b1206; --accent-soft:rgba(229,168,90,.16);
    --good:#5cc27a; --warn:#f0a15c; --warn-bg:#33231a; --danger:#ff8a80; --view:#18232b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
.brand span{display:flex;flex-direction:column;line-height:1.05} .brand small.author{font-size:11px;font-weight:600;letter-spacing:.4px;color:#39ff14;text-transform:none;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font:700 22px/1 var(--head);letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand img{width:26px;height:26px;border-radius:6px}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:7px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--panel2)}
.btn:focus-visible,.tpl:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{height:28px;padding:0 9px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.name{height:32px;width:clamp(120px,18vw,240px);border:1px solid transparent;background:var(--panel2);border-radius:7px;padding:0 10px;font-weight:600}
.name:hover{border-color:var(--line)}
.st{color:var(--ink3);font-size:12px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.lbl{font-size:12px;color:var(--ink3);margin-right:-4px}
.sel{height:32px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:0 8px}
.badge{height:32px;padding:0 11px;border:1px solid var(--line);border-radius:7px;display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);white-space:nowrap}
.badge b{color:var(--ink3)} .badge.ok b{color:var(--good)} .badge.bad b{color:var(--danger)}
.menuWrap{position:relative}
.menu{position:absolute;left:0;top:calc(100% + 6px);z-index:60;width:330px;max-width:calc(100vw - 24px);max-height:min(74vh,620px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:6px}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px}
.menu .mi:hover{background:var(--panel2)}
.menu .mh{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:12px 10px 6px;border-top:1px solid var(--line);margin-top:6px}
.menu .row{display:flex;gap:6px;align-items:center}
.menu .row .mi{flex:1;min-width:0}
.menu .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .dt{font:500 11px var(--mono);color:var(--ink3)}
.menu .cur .mi{background:var(--accent-soft);font-weight:600}
.menu .del{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--danger);flex:none}
.menu .empty{padding:8px 10px;color:var(--ink3);font-size:13px}

.main{flex:1;display:flex;min-height:0}
#tpls{width:236px;flex:none;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:8px}
.gh{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:4px 2px}
.tpl{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.tpl:hover{background:var(--panel2)}
.tpl.on{border-color:var(--accent);background:var(--accent-soft)}
.tpl svg{flex:none;width:34px;height:34px}
.tpl b{display:block;font-weight:600}
.tpl small{display:block;color:var(--ink3);font-size:12px;line-height:1.3;margin-top:2px}
#viewCol{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.vbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{height:30px;padding:0 11px;border:none;background:var(--panel);font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent2);color:#fff}
#view{flex:1;min-height:0;position:relative;background:var(--view);overflow:hidden}
#view canvas{position:absolute;inset:0;display:block;touch-action:none}
#vmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--ink2);line-height:1.6;z-index:1}
.vnote{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--ink3);pointer-events:none;z-index:1}
.pGrip{flex:none;width:12px;cursor:ew-resize;background:var(--panel);border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;touch-action:none}
#tplsGrip{border-left:none;border-right:1px solid var(--line)}
.pGrip span{width:4px;height:70px;border-radius:3px;background:repeating-linear-gradient(#8a9aa5 0 4px,transparent 4px 8px)}
.pGrip:hover,.pGrip.on{background:#c98a3a}.pGrip:hover span,.pGrip.on span{background:repeating-linear-gradient(#fff 0 4px,transparent 4px 8px)}
#side{width:340px;flex:none;overflow:auto;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h2{margin:0 0 4px;font:700 20px/1.1 var(--head);letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.sec h3{margin:0 0 10px;font:700 14px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);padding-bottom:6px;border-bottom:3px solid var(--accent)}
.desc{color:var(--ink2);font-size:13px;margin:0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.pf{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:12px;color:var(--ink2)}
.pf.full{grid-column:1/-1}
.pf input[type=number],.pf input[type=text],.pf select{height:32px;border:1px solid var(--line);border-radius:7px;padding:0 8px;background:var(--panel2);min-width:0;width:100%;font-variant-numeric:tabular-nums}
.pf small{color:var(--ink3);font-size:11px;line-height:1.3}
.pf.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13px}
.pgh{grid-column:1/-1;font:700 13px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--gc);margin-top:10px;padding:7px 10px;border-top:3px solid var(--gc);background:color-mix(in srgb,var(--gc) 13%,transparent);border-radius:0 0 6px 6px}
.pgh:first-child{margin-top:0}
.pgh.g0{--gc:#0a7f90} .pgh.g1{--gc:#c47a1e} .pgh.g2{--gc:#3d8a3a} .pgh.g3{--gc:#7a55b8} .pgh.g4{--gc:#c0463a} .pgh.g5{--gc:#2f6db5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pgh.g0{--gc:#3cc4d6} :root:not([data-theme="light"]) .pgh.g1{--gc:#e5a85a} :root:not([data-theme="light"]) .pgh.g2{--gc:#7cc96f} :root:not([data-theme="light"]) .pgh.g3{--gc:#b394e8} :root:not([data-theme="light"]) .pgh.g4{--gc:#ef7d6f} :root:not([data-theme="light"]) .pgh.g5{--gc:#6fa8ef}}
:root[data-theme="dark"] .pgh.g0{--gc:#3cc4d6} :root[data-theme="dark"] .pgh.g1{--gc:#e5a85a} :root[data-theme="dark"] .pgh.g2{--gc:#7cc96f} :root[data-theme="dark"] .pgh.g3{--gc:#b394e8} :root[data-theme="dark"] .pgh.g4{--gc:#ef7d6f} :root[data-theme="dark"] .pgh.g5{--gc:#6fa8ef}
#ed svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
#ed .mod{cursor:grab} #ed .mod:active{cursor:grabbing}
.edmode{margin-bottom:8px;width:100%} .edmode button{flex:1;height:auto;min-height:32px;padding:4px 8px}
.nudge{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--ink3)}
.nudge .btn{width:34px;justify-content:center;padding:0}
.part{display:grid;grid-template-columns:12px 1fr auto;gap:2px 9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.part:last-child{border-bottom:none}
.part i{width:12px;height:12px;border-radius:3px;grid-row:1/3}
.part b{font-weight:600}
.part .sz{font:500 12px var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.part .fit{font-size:12px} .fit.ok{color:var(--good)} .fit.bad{color:var(--danger);font-weight:600}
.part .btn{grid-row:1/3;grid-column:3}
.cost{margin-top:10px;border:2px solid var(--line, #c9d6de);border-radius:10px;padding:10px 10px 8px}
.costH{font-weight:800;font-size:14px;margin-bottom:8px}.costH small{font-weight:600;opacity:.65}
.costIn{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px 8px;margin-bottom:10px}
.costIn label{display:flex;flex-direction:column;font-size:11px;gap:2px;opacity:.95}
.costIn select,.costIn input{font:inherit;font-size:13px;padding:4px 5px;border-radius:6px;border:1px solid var(--line, #c9d6de);background:var(--panel);color:var(--ink);width:100%;box-sizing:border-box}
.costBig{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.costBig div{background:rgba(10,127,144,.09);border-radius:8px;padding:7px 4px;text-align:center}
.costBig b{display:block;font-size:17px;white-space:nowrap}.costBig span{font-size:11px;opacity:.75}
.part .sz.pairNote{color:var(--accent);font-family:inherit}
.part .sz.est{color:var(--accent2);font-weight:600}
.fitBar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.fitBar .btn{min-width:58px;font-weight:800}
.tfix{margin-top:6px;font-size:12px}.tfix summary{cursor:pointer;color:var(--accent2);font-weight:700}
.tfixRow{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap}.tfixRow input{width:70px;font:inherit;padding:4px 5px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.part .btn.cutBtn{grid-row:auto;grid-column:2 / -1;margin-top:4px;justify-self:start}
.cutInfo{margin-top:6px;font-size:12px;background:var(--accent-soft);border-radius:8px;padding:6px 8px;line-height:1.45}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
.kv span:last-child{font:500 13px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
ul.bom{margin:0;padding-left:18px;font-size:13px;color:var(--ink2)} ul.bom li{margin:2px 0}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:7px;padding:7px 10px;font-size:12.5px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:80;max-width:min(560px,92vw);font-size:13.5px}
#modal{position:fixed;inset:0;background:rgba(5,12,18,.5);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);width:min(480px,100%);max-height:92vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.dlg h3{margin:0;font:700 21px var(--head);text-transform:uppercase;letter-spacing:.04em}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.dlg input[type=text],.dlg input[type=password]{height:34px;border:1px solid var(--line);border-radius:7px;padding:0 9px;background:var(--panel2)}
.dlg .hint{font-size:12px;color:var(--ink3)}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.dlg .lchk{flex-direction:row;align-items:center;gap:8px}
.dlg .box{border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px}

/* wlasny model (klocki) */
.frTpl{border-color:var(--accent2)}
.frAdd{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}
.frB{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:12px;font-weight:600;color:var(--ink);line-height:1.1;text-align:center}
.frB.hole{background:transparent;border-style:dashed}
.frB:hover{background:var(--panel2);border-color:var(--accent2);color:var(--ink)}
.frB svg{width:52px;height:52px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.frB:active svg{transform:scale(.94)}
.frTools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.frGrid{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3)} .frGrid select{height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:0 4px}
.frBusy{font-size:12px;color:var(--warn);font-weight:600}
.frList{display:flex;flex-direction:column;gap:3px;max-height:230px;overflow:auto;margin:8px 0}
.frRow{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid transparent;border-radius:6px;background:var(--panel2);text-align:left;font-size:13px}
.frRow:hover{border-color:var(--line)} .frRow.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.frRow .ic{width:26px;height:26px;flex:none} .frRow .ic svg{width:26px;height:26px}
.frRow i.hole{background:repeating-linear-gradient(45deg,#d0453a 0 3px,transparent 3px 6px)}
.frRow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .frRow .ty{font-size:11px;color:var(--ink3)}
.pgh.sub{font-size:11px;padding:3px 8px;margin-top:4px;border-top-width:1px;--gc:var(--ink3);background:none}
.frHole{width:100%} .frHole button{flex:1}
.frCols{display:flex;flex-wrap:wrap;gap:6px} .frCols button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)} .frCols button.on{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2)}
.frRot{display:flex;gap:4px;flex-wrap:wrap}
.frAlign{display:grid;grid-template-columns:18px repeat(3,1fr) 18px repeat(3,1fr);gap:4px;align-items:center;font-size:12px;color:var(--ink3)} .frAlign span{text-align:right}
.frAlign{grid-template-columns:18px repeat(3,1fr)}
.frKeys{margin-top:12px;font-size:12px;color:var(--ink2)} .frKeys summary{cursor:pointer;font-weight:600} .frKeys ul{margin:6px 0 0;padding-left:16px} .frKeys li{margin:3px 0}
.pf input.ro{background:transparent;border-style:dashed;color:var(--ink3)}
.part .tofree{grid-row:auto;grid-column:3;font-size:12.5px;margin-top:4px;display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--line);border-radius:7px;cursor:pointer;white-space:nowrap;background:var(--panel);font-weight:600}
.part .tofree input{width:17px;height:17px;margin:0;accent-color:var(--accent2);cursor:pointer}
.part .tofree.on{border-color:var(--accent2);background:rgba(10,127,144,.12);color:var(--accent2)}
.tfBar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:9px 10px;margin-bottom:8px;border:2px dashed var(--accent2);border-radius:10px;background:rgba(10,127,144,.06)}
.tfBar #btnToFree{font-weight:700} .tfBar small{flex-basis:100%;font-size:12px;color:var(--ink2)}
#frLab{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
/* ---- Magazyn obiektow 3D ---- */
#libView{position:fixed;inset:0;z-index:65;background:var(--bg);display:flex;flex-direction:column}
#libView[hidden]{display:none}
.lbTop{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.lbTop h2{margin:0 10px 0 0;font-size:22px}
.lbTop input[type=search]{height:36px;min-width:280px;flex:0 1 360px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit;font-size:15px}
.lbTop select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0 8px;font:inherit}
.lbTop .btn{height:36px;font-size:14px}
.lbChips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.lbChip{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:16px;background:var(--panel2);color:var(--ink);font-weight:600}
.lbChip small{color:var(--ink3);font-weight:500;margin-left:3px} .lbChip.on{border-color:var(--accent2);background:var(--accent2);color:#fff} .lbChip.on small{color:#e6f6f8}
.lbTot{margin-left:auto;font-size:13px;color:var(--ink3)}
.lbMain{flex:1;min-height:0;display:flex}
.lbGrid{flex:1;min-width:0;overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;align-content:start}
.lbCard{display:flex;flex-direction:column;text-align:left;padding:0;border:2px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;color:var(--ink)}
.lbCard:hover{border-color:var(--accent)} .lbCard.on{border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent2)}
.lbImg{position:relative;aspect-ratio:4/3;background:#e3eaee;display:flex;align-items:center;justify-content:center}
.lbImg img{width:100%;height:100%;object-fit:cover;display:block}

  const tx = (m, f) => new Promise((res, rej) => { const t = db.transaction(OS, m), s = t.objectStore(OS), q = f(s); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  const idbGet = (k) => tx('readonly', s => s.get(k)), idbPut = (k, v) => tx('readwrite', s => s.put(v, k)), idbDel = (k) => tx('readwrite', s => s.delete(k)), idbKeys = () => tx('readonly', s => s.getAllKeys());
  // ---- folder na dysku (File System Access API)
  const canFolder = typeof window.showDirectoryPicker === 'function';
  async function sub(make) { return L.dir.getDirectoryHandle('pliki', { create: !!make }); }
  async function fsGet(name) {
    try { const parts = name.split('/'), d = parts.length > 1 ? await sub(false) : L.dir; const fh = await d.getFileHandle(parts[parts.length - 1]); return await fh.getFile(); }
    catch (e) { return null; }
  }
  async function fsPut(name, blob) {
    const parts = name.split('/'), d = parts.length > 1 ? await sub(true) : L.dir, fh = await d.getFileHandle(parts[parts.length - 1], { create: true });
    const w = await fh.createWritable(); await w.write(blob); await w.close();
  }
  async function fsDel(name) { try { const parts = name.split('/'), d = parts.length > 1 ? await sub(false) : L.dir; await d.removeEntry(parts[parts.length - 1]); } catch (e) {} }
  async function fsList() { const out = []; try { const d = await sub(false); for await (const [n, h] of d.entries()) if (h.kind === 'file') out.push('pliki/' + n); } catch (e) {} return out; }
  // ---- wspolne: czytaj / zapisz (folder = glowny zapis; dane.json zawsze tez w przegladarce jako zapas)
  const folder = () => L.mode === 'folder' && L.dir;
  async function get(name) { if (folder()) { const f = await fsGet(name); if (f) return f; } const v = await idbGet(name).catch(() => null); return v || null; }

  }
  async function del(name) { if (folder()) await fsDel(name); await idbDel(name).catch(() => {}); const u = L.urls.get(name.replace(/^pliki\//, '')); if (u) { URL.revokeObjectURL(u); L.urls.delete(name.replace(/^pliki\//, '')); } }
  L.get = get; L.put = put; L.del = del;
  // obrazki z magazynu: <img src> potrzebuje adresu - robimy go z pliku (blob:), a gdy jeszcze go nie ma, strona narysuje sie jeszcze raz
  let rr = 0;
  L.url = (n) => {
    if (!n) return ''; if (L.urls.has(n)) return L.urls.get(n) || '';
    L.urls.set(n, null);
    get('pliki/' + n).then(b => { if (b) { L.urls.set(n, URL.createObjectURL(b)); clearTimeout(rr); rr = setTimeout(() => { if (typeof libRender === 'function') libRender(); }, 60); } else L.urls.delete(n); });
    return '';
  };
  L.urlAsync = async (n) => { if (L.urls.get(n)) return L.urls.get(n); const b = await get('pliki/' + n); if (!b) return ''; const u = URL.createObjectURL(b); L.urls.set(n, u); return u; };
  L.label = () => folder() ? 'Zapis: folder „' + L.dirName + '”' : 'Zapis: w przeglądarce';
  // ---- "plytka": /api/... obslugujemy tutaj
  const nativeFetch = window.fetch.bind(window);
  window.fetch = async (input, init) => {

    const i = url.pathname.indexOf('/api/');

    await L.ready;
    const p = url.pathname.slice(i + 5), m = ((init && init.method) || 'GET').toUpperCase(), n = url.searchParams.get('n') || '';
    const bad = (t, s) => new Response(t, { status: s || 400 });
    try {
      if (p === 'status') return new Response('ok');
      if (p === 'db') {
        if (m === 'GET') { const b = await get('dane.json'); return b ? new Response(b, { headers: { 'Content-Type': 'application/json' } }) : bad('brak danych', 404); }
        const f = init.body.get('db'); await put('dane.json', f); return new Response('ok');
      }
      if (!/^[A-Za-z0-9_.-]{1,60}$/.test(n) && (p === 'f' || p === 'fdel')) return bad('zla nazwa');
      if (p === 'f') {
        if (m === 'GET') { const b = await get('pliki/' + n); return b ? new Response(b) : bad('brak pliku', 404); }
        const f = init.body.get('f'); await put('pliki/' + n, f); return new Response('ok');

  };
  // ---- okienko startowe / wybor folderu
  function box(html) {
    let o = document.getElementById('w3dLocalBox');
    if (!o) { o = document.createElement('div'); o.id = 'w3dLocalBox'; document.body.appendChild(o); }
    o.innerHTML = '<div class="w3lb">' + html + '</div>'; o.hidden = false; return o;
  }
  const hideBox = () => { const o = document.getElementById('w3dLocalBox'); if (o) o.hidden = true; };
  const author = '<div class="w3la">Warsztat 3D - autor Adam Bryks 2026</div>';
  async function copyAll(fromFolder, toFolder) {
    // przenies dane.json i pliki miedzy przegladarka a folderem (gdy nowy folder jest pusty)
    const saveMode = L.mode, saveDir = L.dir;
    const names = ['dane.json'].concat(fromFolder ? await fsList() : (await idbKeys()).filter(k => String(k).startsWith('pliki/')));
    const blobs = [];
    for (const k of names) { L.mode = fromFolder ? 'folder' : 'idb'; L.dir = fromFolder ? saveDir : null; const b = await get(k); if (b) blobs.push([k, b]); }

  }
  L.chooseFolder = async () => {
    if (!canFolder) { alert('Ta przeglądarka nie umie zapisywać do folderu - użyj Chrome albo Edge na komputerze.'); return; }
    let h; try { h = await window.showDirectoryPicker({ id: 'warsztat3d', mode: 'readwrite' }); } catch (e) { return; }

  L.useBrowser = async () => { if (!confirm('Zapisywać tylko w przeglądarce (bez folderu na dysku)? Projekty w folderze zostaną tam, gdzie są.')) return; await idbDel('__dir'); location.reload(); };
  L.ready = (async () => {

      await new Promise(res => {
        const o = box(author + '<h2>&#128193; Twoje projekty</h2><p>Projekty i Magazyn są w folderze <b>„' + h.name.replace(/</g, '&lt;') + '”</b> na dysku.</p><p>Kliknij, a Chrome zapyta o zgodę (<b>„Dateien bearbeiten erlauben?”</b> → <b>Zulassen</b>).</p><div class="w3lbtn"><button type="button" class="w3p" id="w3Open">&#128194; Otwórz folder „' + h.name.replace(/</g, '&lt;') + '”</button><button type="button" id="w3Browser">Pracuj w przeglądarce</button></div>');
        o.querySelector('#w3Open').onclick = async () => { let s = 'denied'; try { s = await h.requestPermission({ mode: 'readwrite' }); } catch (e) {} if (s === 'granted') { L.mode = 'folder'; hideBox(); res(); } };

    const asked = await idbGet('__asked').catch(() => null), hasData = await idbGet('dane.json').catch(() => null);
    if (canFolder && !asked && !hasData) {
      await new Promise(res => {
        const o = box(author + '<h2>&#128075; Witaj w Warsztacie 3D</h2><p>Gdzie zapisywać Twoje projekty i Magazyn?</p><ul><li><b>Folder na dysku</b> (polecam) - normalne pliki, widzisz je w Explorerze, kopię robisz jednym ruchem.</li><li><b>W przeglądarce</b> - nic nie trzeba wybierać, ale po „Browserdaten löschen” wszystko znika.</li></ul><div class="w3lbtn"><button type="button" class="w3p" id="w3Pick">&#128193; Wybierz folder na dysku…</button><button type="button" id="w3Browser">Na razie w przeglądarce</button></div><p class="w3s">Wskazówka: utwórz np. folder <b>Dokumente\\Warsztat3D</b>. Folder zmienisz później przyciskiem „&#128193; Zapis” na górze.</p>');
        o.querySelector('#w3Pick').onclick = async () => { await idbPut('__asked', 1); await L.chooseFolder(); };
        o.querySelector('#w3Browser').onclick = async () => { await idbPut('__asked', 1); hideBox(); res(); };

    }
  })();
  // ---- wyglad okienka
  const css = document.createElement('style');
  css.textContent = '#w3dLocalBox{position:fixed;inset:0;z-index:200;background:rgba(5,12,18,.6);display:flex;align-items:center;justify-content:center;padding:16px}#w3dLocalBox[hidden]{display:none}' +
    '.w3lb{background:#f7f9fa;color:#142630;border-radius:14px;max-width:560px;width:100%;padding:24px 28px;box-shadow:0 12px 40px rgba(0,0,0,.4);font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif}' +
    '.w3lb h2{margin:4px 0 10px;font-size:26px}.w3lb ul{padding-left:20px}.w3la{font-size:13px;font-weight:700;color:#0a7f90;letter-spacing:.5px;text-transform:uppercase}' +
    '.w3lbtn{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 6px}.w3lbtn button{height:44px;padding:0 18px;border-radius:9px;border:1px solid #9aabb6;background:#fff;font:600 16px system-ui,sans-serif;cursor:pointer}' +
    '.w3lbtn .w3p{background:#c98a3a;border-color:#a8712c;color:#fff}.w3s{font-size:13px;color:#46596a}';
  document.head.appendChild(css);
})();

</script>

<script>
'use strict';
/* =====================  narzedzia  ===================== */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const f1 = (v) => (Math.round(v * 10) / 10).toLocaleString('pl-PL', { maximumFractionDigits: 1 });
let toastT = 0;
function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms || 2800); }
function download(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function fileSafe(s) { return String(s || 'model').replace(/[^0-9A-Za-z_\-ąćęłńóśźżĄĆĘŁŃÓŚŹŻ ]+/g, '').trim().replace(/\s+/g, '_') || 'model'; }
function dateStr(t) { if (!t) return ''; const d = new Date(t), z = (n) => String(n).padStart(2, '0'); return z(d.getDate()) + '.' + z(d.getMonth() + 1) + '.' + d.getFullYear(); }

/* =====================  geometria (mm, os Z w gore)  =====================
   Kazda czesc to lista trojkatow T = [[x,y,z],[x,y,z],[x,y,z], ...] (po 3 punkty).
   Bryly moga na siebie zachodzic - program do krojenia (Creality Print, Cura) i tak je laczy. */
const G = {
  box(T, x0, y0, z0, x1, y1, z1) {
    if (x1 < x0) [x0, x1] = [x1, x0]; if (y1 < y0) [y0, y1] = [y1, y0]; if (z1 < z0) [z0, z1] = [z1, z0];
    if (x1 - x0 < 1e-3 || y1 - y0 < 1e-3 || z1 - z0 < 1e-3) return T;
    const V = (x, y, z) => [x, y, z];
    T.push(V(x0, y0, z0), V(x0, y1, z0), V(x1, y1, z0), V(x0, y0, z0), V(x1, y1, z0), V(x1, y0, z0));
    T.push(V(x0, y0, z1), V(x1, y0, z1), V(x1, y1, z1), V(x0, y0, z1), V(x1, y1, z1), V(x0, y1, z1));
    T.push(V(x0, y0, z0), V(x1, y0, z0), V(x1, y0, z1), V(x0, y0, z0), V(x1, y0, z1), V(x0, y0, z1));
    T.push(V(x0, y1, z0), V(x0, y1, z1), V(x1, y1, z1), V(x0, y1, z0), V(x1, y1, z1), V(x1, y1, z0));
    T.push(V(x0, y0, z0), V(x0, y0, z1), V(x0, y1, z1), V(x0, y0, z0), V(x0, y1, z1), V(x0, y1, z0));
    T.push(V(x1, y0, z0), V(x1, y1, z0), V(x1, y1, z1), V(x1, y0, z0), V(x1, y1, z1), V(x1, y0, z1));
    return T;
  },
  // rura / walec (ri = 0 -> pelny walec); seg = 6 daje szesciokat
  tube(T, cx, cy, z0, z1, ro, ri, seg, rot) {
    seg = seg || 40; rot = rot || 0;
    const P = (r, a, z) => [cx + r * Math.cos(a), cy + r * Math.sin(a), z];
    for (let k = 0; k < seg; k++) {
      const a = rot + k / seg * Math.PI * 2, b = rot + (k + 1) / seg * Math.PI * 2;
      const oa0 = P(ro, a, z0), ob0 = P(ro, b, z0), ob1 = P(ro, b, z1), oa1 = P(ro, a, z1);
      T.push(oa0, ob0, ob1, oa0, ob1, oa1);
      if (ri > 0) {
        const ia0 = P(ri, a, z0), ib0 = P(ri, b, z0), ib1 = P(ri, b, z1), ia1 = P(ri, a, z1);
        T.push(ia0, ib1, ib0, ia0, ia1, ib1);
        T.push(oa1, ob1, ib1, oa1, ib1, ia1);
        T.push(oa0, ib0, ob0, oa0, ia0, ib0);
      } else {
        T.push([cx, cy, z1], oa1, ob1, [cx, cy, z0], ob0, oa0);
      }
    }
    return T;
  },
  // bryla obrotowa: zamkniety wielokat [[r,z],...] obracany wokol osi Z
  lathe(T, prof, seg, cx, cy) {
    seg = seg || 64; cx = cx || 0; cy = cy || 0;
    let A = 0; for (let i = 0; i < prof.length; i++) { const p = prof[i], q = prof[(i + 1) % prof.length]; A += p[0] * q[1] - q[0] * p[1]; }
    const pr = A < 0 ? prof.slice().reverse() : prof;
    const P = (r, a, z) => [cx + r * Math.cos(a), cy + r * Math.sin(a), z];
    for (let i = 0; i < pr.length; i++) {
      const [r1, z1] = pr[i], [r2, z2] = pr[(i + 1) % pr.length];
      if (r1 < 1e-6 && r2 < 1e-6) continue;
      for (let k = 0; k < seg; k++) {
        const a = k / seg * Math.PI * 2, b = (k + 1) / seg * Math.PI * 2;
        const A1 = P(r1, a, z1), B1 = P(r1, b, z1), B2 = P(r2, b, z2), A2 = P(r2, a, z2);
        if (r1 > 1e-6) T.push(A1, B1, B2);
        if (r2 > 1e-6) T.push(A1, B2, A2);
      }
    }
    return T;
  },
  // sciana z prostokatnymi otworami. axis 'x' = sciana wzdluz X (grubosc w Y: b0..b1), 'y' = wzdluz Y (grubosc w X)
  // holes: [{o0,o1 (wzdluz osi), z0,z1}] - otwory nie moga na siebie zachodzic wzdluz osi
  wall(T, axis, a0, a1, b0, b1, zb, zt, holes) {
    const box = (p0, p1, z0, z1) => axis === 'x' ? G.box(T, p0, b0, z0, p1, b1, z1) : G.box(T, b0, p0, z0, b1, p1, z1);
    const hs = (holes || []).filter(Boolean).map(h => ({ o0: Math.max(a0, h.o0), o1: Math.min(a1, h.o1), z0: Math.max(zb, h.z0), z1: Math.min(zt, h.z1) }))
      .filter(h => h.o1 > h.o0 && h.z1 > h.z0).sort((p, q) => p.o0 - q.o0);
    let x = a0;
    for (const h of hs) {
      if (h.o0 < x) continue;
      box(x, h.o0, zb, zt); box(h.o0, h.o1, zb, h.z0); box(h.o0, h.o1, h.z1, zt);
      x = h.o1;
    }
    box(x, a1, zb, zt);
    return T;
  },
  // kwadratowy kawalek plyty (bok 2*(r+m)) z okraglym otworem o promieniu r w srodku (cx,cy)

  build(v) {
    const C = this.fitVals(v), n = C.length, rows = n > 6 ? 2 : 1, cols = Math.ceil(n / rows), th = v.th, R0 = v.d / 2;

      if (c == null) continue;
      const lab = textRects(c.toFixed(2).replace('.', ','), tH, true, 40), cx = x0 + pitch / 2, ly = y0 + 1.6;

    const sv = fitSaved(), pr = printer();

      { name: 'Płytka z otworami', file: 'test_luzu_plytka', tris: G.toBed(plate), asmTris: plate, count: 1, color: COL[1], asm: [[0, 0, 0]] },
      { name: 'Kołek Ø' + f1(v.d), file: 'test_luzu_kolek', tris: G.toBed(Kc), asmTris: G.move(Kc, W + gw / 2 + 8, gw / 2, 0), count: 1, color: COL[0], asm: [[0, 0, 0]] }
    ], warn: [],

    { k: 'feedH', label: 'Wysokość pierścienia', def: 12, min: 5, max: 40, step: 1, show: (v) => v.kind === 'feed', hint: 'ustaw „Jak nisko” tak, żeby pierścień był do połowy w wodzie' },
    { k: 'tubeD', label: 'Średnica rury wlotu', def: 16, min: 6, max: 50, step: 0.5, show: (v) => v.kind === 'intake', hint: 'zewnętrzna średnica rury filtra (np. 12, 16, 19 mm)' },
    { k: 'intL', label: 'Długość osłony', def: 60, min: 20, max: 200, step: 1, show: (v) => v.kind === 'intake' },
    { k: 'slot', label: 'Szerokość szczelin', def: 1, min: 0.6, max: 4, step: 0.1, show: (v) => v.kind === 'intake' || v.kind === 'plant', hint: 'narybek i krewetki: 0,8-1 mm' },
    { k: 'caveW', label: 'Szerokość jaskini', def: 60, min: 20, max: 200, step: 1, show: (v) => v.kind === 'cave' },
    { k: 'caveL', label: 'Długość jaskini', def: 80, min: 20, max: 250, step: 1, show: (v) => v.kind === 'cave' },
    { k: 'caveBack', label: 'Tył jaskini', def: 'closed', opts: [['closed', 'zamknięty'], ['open', 'otwarty (tunel)']], show: (v) => v.kind === 'cave' },
    { k: 'potD', label: 'Średnica koszyczka', def: 40, min: 15, max: 120, step: 1, show: (v) => v.kind === 'plant' },
    { k: 'potH', label: 'Wysokość koszyczka', def: 35, min: 10, max: 120, step: 1, show: (v) => v.kind === 'plant' },

  ],
  build(v) {
    const t = v.wallT, warn = [], info = [], bom = ['Drukuj z PETG - w wodzie nie mięknie (PLA w wodzie z czasem się rozkłada)', 'bez dodatków typu „Silk” / „Glitter” / z metalem'];
    if (/^PLA/.test(DB.settings.mat || '')) warn.push('Wybrany materiał to ' + DB.settings.mat + ' - do akwarium lepiej PETG (PLA w wodzie z czasem mięknie i się rozkłada).');
    // pierscien / obejma (oś pionowa): od kata a0 do a1 (otwor gdzie indziej), wycinki jako wypukle czworokaty
    const ring = (T, cx, cy, z0, z1, ri, ro, gapW, gapDir) => {
      const N = 64, ga = gapW > 0 ? Math.asin(Math.min(0.98, gapW / 2 / ri)) : 0;
      for (let k = 0; k < N; k++) {
        const a = k / N * Math.PI * 2, b = (k + 1) / N * Math.PI * 2, m = (a + b) / 2, d = Math.atan2(Math.sin(m - gapDir), Math.cos(m - gapDir));
        if (ga && Math.abs(d) < ga) continue;
        G.prismZ(T, [[cx + ri * Math.cos(a), cy + ri * Math.sin(a)], [cx + ro * Math.cos(a), cy + ro * Math.sin(a)], [cx + ro * Math.cos(b), cy + ro * Math.sin(b)], [cx + ri * Math.cos(b), cy + ri * Math.sin(b)]], z0, z1);
      }
      return T;
    };
    // sciany ze szczelinami (zebra), oś pionowa
    const slotted = (T, cx, cy, z0, z1, ri, ro, sw) => {
      const rib = Math.max(1.4, t * 0.7), N = Math.max(6, Math.floor(Math.PI * 2 * (ri + ro) / 2 / (rib + sw)));
      for (let k = 0; k < N; k++) {
        const a = k / N * Math.PI * 2, da = rib / ((ri + ro) / 2);
        const P = [[ri * Math.cos(a), ri * Math.sin(a)], [ro * Math.cos(a), ro * Math.sin(a)], [ro * Math.cos(a + da), ro * Math.sin(a + da)], [ri * Math.cos(a + da), ri * Math.sin(a + da)]].map(([x, y]) => [cx + x, cy + y]);
        G.prismZ(T, P, z0, z1);
      }
      return N;
    };
    // zaczep na szybe (drukowany na stojaco, oba ramiona do stolu; mostek nad szyba drukuje sie mostkiem)
    const clip = (T, W, L) => {
      const gap = v.glass + 0.6;
      G.box(T, -t, 0, L, gap + t, W, L + t);        // mostek nad szyba
      G.box(T, -t, 0, 0, 0, W, L + t);              // ramie z zewnatrz
      G.box(T, gap, 0, 0, gap + t, W, L + t);       // ramie od strony wody
      return gap + t;                               // tu zaczyna sie strona wody
    };
    const parts = [];
    let T = [], name = '', file = '';
    if (v.kind === 'hose' || v.kind === 'heater') {
      const D = v.kind === 'hose' ? v.hoseD : v.heatD, ri = D / 2 + 0.25, ro = ri + Math.max(1.6, t * 0.8), n = v.kind === 'hose' ? v.hoseN : 1;
      const pitch = 2 * ro + 2, W = Math.max(14, n * pitch), x0 = clip(T, W, v.leg), hr = Math.min(Math.max(8, D * 0.6), v.leg);
      for (let i = 0; i < n; i++) ring(T, x0 + ro - 0.8, W / 2 + (i - (n - 1) / 2) * pitch, 0, hr, ri, ro, v.snapC === 'open' ? D * 0.8 : 0, 0);
      name = v.kind === 'hose' ? 'Uchwyt na wąż' : 'Uchwyt na grzałkę'; file = v.kind === 'hose' ? 'akwarium_uchwyt_weza_' + D + 'mm' : 'akwarium_uchwyt_grzalki_' + D + 'mm';
      info.push(['Obejma', f1(ri * 2) + ' mm' + (v.snapC === 'open' ? ' (otwarta - wciskasz z boku)' : '')]);
    } else if (v.kind === 'feed') {
      const ri = v.feedD / 2, ro = ri + t, W = Math.min(40, Math.max(20, v.feedD * 0.4)), x0 = clip(T, W, v.leg);
      ring(T, x0 + ro - t, W / 2, 0, Math.min(v.feedH, v.leg), ri, ro, 0, 0);
      G.box(T, x0 - 0.5, 2, 0, x0 + 2 * t, W - 2, Math.min(v.feedH, v.leg));   // wzmocnienie przy ramieniu
      name = 'Pierścień do karmienia'; file = 'akwarium_karmnik_' + v.feedD + 'mm';
      info.push(['Pierścień', 'Ø ' + f1(v.feedD) + ' mm w środku, wysokość ' + f1(Math.min(v.feedH, v.leg)) + ' mm']);
    } else if (v.kind === 'plant') {
      const ri = v.potD / 2, ro = ri + t, H = v.potH, W = Math.min(40, Math.max(20, v.potD * 0.5)), x0 = clip(T, W, Math.max(v.leg, H)), cx = x0 + ro - t;
      G.tube(T, cx, W / 2, 0, 2, ro, 0, 64);              // dno
      G.tube(T, cx, W / 2, H - 3, H, ro, ri, 64);          // gorny brzeg
      slotted(T, cx, W / 2, 1.9, H - 2.9, ri, ro, v.slot);
      name = 'Koszyczek na roślinkę'; file = 'akwarium_koszyczek_' + v.potD + 'mm';
      info.push(['Koszyczek', 'Ø ' + f1(v.potD) + ' × ' + f1(H) + ' mm, szczeliny ' + f1(v.slot) + ' mm']);
    } else if (v.kind === 'intake') {
      const ri = v.tubeD / 2 + 0.3, ro = ri + t, L = v.intL, col = Math.min(10, L / 3);
      G.tube(T, 0, 0, 0, 2, ro, 0, 64);                   // zamkniety spod
      G.tube(T, 0, 0, L - col, L, ro, ri, 64);            // kolnierz na rure (u gory)
      const n = slotted(T, 0, 0, 1.9, L - col + 0.1, ri, ro, v.slot);
      name = 'Osłona wlotu filtra'; file = 'akwarium_oslona_wlotu_' + v.tubeD + 'mm';
      info.push(['Wsuwasz na rurę', 'Ø ' + f1(v.tubeD) + ' mm (w środku ' + f1(ri * 2) + ' mm), ' + n + ' szczelin po ' + f1(v.slot) + ' mm']);
      if (v.slot > 1.5) warn.push('Szczeliny szersze niż 1,5 mm - narybek i małe krewetki mogą się przecisnąć.');
    } else {
      // jaskinia: polowa rury lezaca na stole + zamkniety tyl
      const R = v.caveW / 2, r = R - t, L = v.caveL, N = 48;
      for (let k = 0; k < N; k++) {
        const a = k / N * Math.PI, b = (k + 1) / N * Math.PI;
        G.prism(T, [[R * Math.cos(a), R * Math.sin(a)], [R * Math.cos(b), R * Math.sin(b)], [r * Math.cos(b), r * Math.sin(b)], [r * Math.cos(a), r * Math.sin(a)]], 0, L);
      }
      if (v.caveBack === 'closed') G.prism(T, Array.from({ length: N + 1 }, (_, k) => [R * Math.cos(k / N * Math.PI), R * Math.sin(k / N * Math.PI)]), L - t, L);
      name = 'Jaskinia'; file = 'akwarium_jaskinia_' + v.caveW + 'x' + v.caveL;
      info.push(['Wejście', f1(2 * r) + ' × ' + f1(r) + ' mm (szer. × wys.)'], ['Wymiar', f1(L) + ' × ' + f1(2 * R) + ' × ' + f1(R) + ' mm']);
    }
    if (['hose', 'heater', 'feed', 'plant'].includes(v.kind)) info.unshift(['Na szybę', f1(v.glass) + ' mm (z luzem ' + f1(v.glass + 0.6) + ' mm)']);
    const bb = G.bbox(T);
    parts.push({ name, file, tris: G.toBed(T), asmTris: T, count: 1, color: COL[1], asm: [[0, 0, 0]] });
    if (['hose', 'heater', 'feed', 'plant'].includes(v.kind)) {
      const gl = G.box([], 0.3, -15, -40, v.glass + 0.3, bb.size[1] + 15, Math.max(v.leg, v.kind === 'plant' ? v.potH : 0) + 0.3);
      parts.push({ name: 'Szyba (podgląd)', ghost: true, tris: gl, asmTris: gl, count: 1, color: '#8fd3e8', asm: [[0, 0, 0]] });
    }
    return { parts, warn, info, bom };
  } }
];

/* =====================  WLASNY MODEL (klocki jak w Tinkercad)  =====================
   Model = lista klockow (obj). Kazdy klocek: typ, polozenie (x,y = srodek, z = spod - po obrocie),
   wymiary w swoich osiach (w,d,h), obrot (rx,ry,rz w stopniach), "otwor" (hole) i kolor.
   Otwory wycinane sa z bryl silnikiem CSG (drzewo BSP) dopiero przy liczeniu wyniku. */

/* ---------- CSG (BSP) - na podstawie idei csg.js (E. Wallace, MIT), wersja bez rekurencji ---------- */
const CSG = (() => {
  const EPS = 1e-5;
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function planeOf(v) {
    const n = cross(sub(v[1], v[0]), sub(v[2], v[0])), l = Math.hypot(n[0], n[1], n[2]);
    if (!(l > 1e-12)) return null;
    const nn = [n[0] / l, n[1] / l, n[2] / l];
    return { n: nn, w: dot(nn, v[0]) };
  }
  const poly = (verts, plane) => ({ v: verts, p: plane });
  function split(pl, P, cf, cb, f, b) {
    let type = 0; const ts = [];
    for (const v of P.v) { const t = dot(pl.n, v) - pl.w, ty = t < -EPS ? 2 : t > EPS ? 1 : 0; type |= ty; ts.push(ty); }
    if (type === 0) (dot(pl.n, P.p.n) > 0 ? cf : cb).push(P);
    else if (type === 1) f.push(P);
    else if (type === 2) b.push(P);
    else {
      const F = [], B = [], n = P.v.length;
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n, ti = ts[i], tj = ts[j], vi = P.v[i], vj = P.v[j];
        if (ti !== 2) F.push(vi);
        if (ti !== 1) B.push(vi);
        if ((ti | tj) === 3) { const t = (pl.w - dot(pl.n, vi)) / dot(pl.n, sub(vj, vi)), v = lerp(vi, vj, t); F.push(v); B.push(v); }
      }
      if (F.length >= 3) f.push(poly(F, P.p));
      if (B.length >= 3) b.push(poly(B, P.p));
    }
  }
  const node = () => ({ plane: null, front: null, back: null, polys: [] });
  function build(root, polys) {
    const st = [[root, polys]];
    while (st.length) {
      const [nd, ps] = st.pop();
      if (!ps.length) continue;
      if (!nd.plane) nd.plane = { n: ps[0].p.n.slice(), w: ps[0].p.w };
      const f = [], b = [];
      for (const P of ps) split(nd.plane, P, nd.polys, nd.polys, f, b);
      if (f.length) { if (!nd.front) nd.front = node(); st.push([nd.front, f]); }
      if (b.length) { if (!nd.back) nd.back = node(); st.push([nd.back, b]); }
    }

/* =====================  okno dialogowe  ===================== */
function ask(title, fields, okText) {
  return new Promise(res => {
    const f = $('#dlg');
    f.innerHTML = `<h3>${esc(title)}</h3>` + fields.map(x => `<label>${esc(x.label)}<input type="text" name="${x.k}" value="${esc(x.value || '')}"></label>`).join('') +
      `<div class="acts"><button type="button" class="btn" id="dNo">Anuluj</button><button type="submit" class="btn primary" id="dOk">${esc(okText || 'OK')}</button></div>`;
    $('#modal').hidden = false;
    const done = (v) => { $('#modal').hidden = true; f.innerHTML = ''; f.onsubmit = () => false; res(v); };
    f.onsubmit = (e) => { e.preventDefault(); const o = {}; fields.forEach(x => { o[x.k] = f.querySelector(`[name="${x.k}"]`).value; }); done(o); return false; };
    $('#dNo').onclick = () => done(null);
    f.onkeydown = (e) => { if (e.key === 'Escape') done(null); };
    const first = f.querySelector('input'); if (first) { first.focus(); first.select(); }
  });
}

async function openWifi() {
  let w = null;
  try { const r = await fetch('/api/wifi', { cache: 'no-store' }); w = await r.json(); } catch (e) { toast('Nie mogę odczytać ustawień WiFi z płytki'); return; }
  const f = $('#dlg');
  const net = (n) => `<div class="box"><b>Sieć ${n}${n === 1 ? ' (najpierw)' : ' (zapasowa, np. hotspot w telefonie)'}</b>

      <label>Hasło<input type="password" name="pass${n}" value="" maxlength="63" autocomplete="new-password" placeholder="${w['has' + n] ? '•••••• (bez zmian - wpisz, żeby zmienić)' : 'brak hasła'}"></label>
      <label class="lchk"><input type="checkbox" name="clear${n}"> usuń zapisane hasło (sieć bez hasła)</label></div>`;
  f.innerHTML = `<h3>WiFi</h3>
    <div class="hint">Teraz: <b>${w.tryb === 'ap' ? 'własna sieć „' + esc(w.siec) + '”' : 'połączono z „' + esc(w.siec) + '”'}</b>, adres <b>${esc(w.ip)}</b>${w.tryb === 'sta' ? ', sygnał ' + w.rssi + ' dBm' : ''}.<br>
    Ustawienia są zapisane na dysku (/w3d/wifi.txt). Płytka łączy się najpierw z siecią 1, potem z siecią 2; gdy żadna nie działa, zakłada własną sieć <b>Warsztat3D</b> (hasło: drukarka3d).</div>
    ${net(1)}${net(2)}
    <div class="acts"><button type="button" class="btn" id="wNo">Zamknij</button><button type="button" class="btn" id="wSave">Zapisz</button><button type="button" class="btn primary" id="wSaveR">Zapisz i uruchom ponownie</button></div>`;
  $('#modal').hidden = false;
  const close = () => { $('#modal').hidden = true; f.innerHTML = ''; };
  const send = async (restart) => {
    const body = new URLSearchParams();
    for (const n of [1, 2]) {
      body.set('ssid' + n, f.querySelector(`[name="ssid${n}"]`).value.trim());
      const p = f.querySelector(`[name="pass${n}"]`).value; if (p) body.set('pass' + n, p);
      if (f.querySelector(`[name="clear${n}"]`).checked) body.set('clear' + n, '1');
    }
    try {
      const r = await fetch('/api/wifi', { method: 'POST', body }); if (!r.ok) throw new Error(await r.text());
      if (restart) { await fetch('/api/restart', { method: 'POST' }); close(); toast('Płytka uruchamia się ponownie - za chwilę otwórz http://warsztat.local (adres może się zmienić)', 8000); }
      else { close(); toast('Zapisano na dysku - nowa sieć zadziała po ponownym uruchomieniu płytki', 4500); }
    } catch (e) { toast('Nie udało się zapisać: ' + e.message, 4500); }
  };
  $('#wNo').onclick = close; $('#wSave').onclick = () => send(false); $('#wSaveR').onclick = () => send(true);
  f.onkeydown = (e) => { if (e.key === 'Escape') close(); };
}
$('#btnWifi').onclick = openWifi;


/* =====================  jasny / ciemny wyglad  ===================== */
function themeNow() { const d = document.documentElement.dataset.theme; return d || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function setTheme(th, save) {
  document.documentElement.dataset.theme = th;
  $('#btnTheme').innerHTML = th === 'dark' ? '&#9728; Dzień' : '&#9790; Noc';
  if (typeof renderFreeTop === 'function' && cur) renderFreeTop();
  if (save) { try { localStorage.setItem('w3dTheme', th); } catch (e) {} if (DB.settings) { DB.settings.theme = th; if (dbLoaded) scheduleSave(); } }
  if (v3.r) v3Build(false);
}
$('#btnTheme').onclick = () => setTheme(themeNow() === 'dark' ? 'light' : 'dark', true);
try { const th = localStorage.getItem('w3dTheme'); if (th === 'dark' || th === 'light') setTheme(th, false); else $('#btnTheme').innerHTML = themeNow() === 'dark' ? '&#9728; Dzień' : '&#9790; Noc'; } catch (e) {}

/* ---- lewa i prawa strona: szerokosc ciagnieta myszka, wszystko rosnie razem (zoom) ---- */
function panelGrip(panel, grip, BASE, fromLeft, key, label) {
  if (!panel || !grip) return;
  const apply = (w, save) => {
    w = clamp(Math.round(w), BASE * 0.85, Math.max(BASE, Math.min(1100, window.innerWidth * (fromLeft ? 0.45 : 0.6))));
    panel.style.width = BASE + 'px'; panel.style.zoom = (w / BASE).toFixed(4);
    if (save) { try { localStorage.setItem(key, String(w)); } catch (e) {} }
    window.dispatchEvent(new Event('resize'));
  };
  const want = (ev) => fromLeft ? ev.clientX - panel.getBoundingClientRect().left - grip.offsetWidth / 2 : window.innerWidth - ev.clientX - grip.offsetWidth / 2;
  try { const w = +localStorage.getItem(key); if (w > 0) apply(w, false); } catch (e) {}
  grip.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return; e.preventDefault(); grip.classList.add('on'); grip.setPointerCapture(e.pointerId);
    const mv = (ev) => apply(want(ev), false);
    const up = (ev) => { grip.removeEventListener('pointermove', mv); grip.removeEventListener('pointerup', up); grip.classList.remove('on'); apply(want(ev), true); };
    grip.addEventListener('pointermove', mv); grip.addEventListener('pointerup', up);
  });
  grip.addEventListener('dblclick', () => { apply(BASE, true); toast(label + ': normalny rozmiar'); });
}
panelGrip($('#side'), $('#sideGrip'), 340, false, 'w3dSideW', 'Prawa strona');
panelGrip($('#tpls'), $('#tplsGrip'), 270, true, 'w3dTplsW', 'Lewa strona');
/* =====================  drukarka / material  ===================== */
$('#selPrinter').innerHTML = PRINTERS.map(p => `<option value="${p.id}" title="${esc(p.name)}, stół ${p.bed.join('×')} mm">${esc(p.short)}</option>`).join('');
$('#selPrinter').onchange = () => { DB.settings.printer = $('#selPrinter').value; renderParts(); if (mode === 'print' || (cur && cur.tpl === 'free')) v3Build(false); if (dbLoaded) scheduleSave(); };
$('#selMat').onchange = () => { DB.settings.mat = $('#selMat').value; renderParts(); if (dbLoaded) scheduleSave(); };

/* =====================  start  ===================== */
async function checkSd() {
  try { const r = await fetch('/api/status', { cache: 'no-store' }); sdOk = (await r.text()).trim() === 'ok'; }
  catch (e) { sdOk = false; }
  const b = $('#sdBadge'); b.className = 'badge ' + (sdOk ? 'ok' : 'bad'); $('#sdTxt').textContent = window.W3D_LOCAL ? W3D_LOCAL.label() : sdOk ? 'Karta SD OK' : 'Brak dysku';
  return sdOk;
}
async function loadDb() {
  try {
    const r = await fetch('/api/db', { cache: 'no-store' });
    if (r.status === 404) { dbLoaded = true; return; }
    if (!r.ok) throw new Error(r.status === 503 ? 'brak dysku' : await r.text());
    const raw = JSON.parse(await r.text());
    if (raw && raw.type === 'warsztat3d') {
      DB.models = {};
      for (const m of Object.values(raw.models || {})) if (m && m.id && isTplId(m.tpl)) DB.models[m.id] = { id: m.id, name: String(m.name || 'Model').slice(0, 60), tpl: m.tpl, v: cleanVals(tplById(m.tpl), m.v), updated: m.updated || 0 };
      DB.last = raw.last && DB.models[raw.last] ? raw.last : null;
      DB.lib = libClean(raw.lib);
      DB.boards = Array.isArray(raw.boards) ? raw.boards.filter(b => b && b.id && b.name && b.v && typeof b.v === 'object').slice(0, 200).map(b => ({ id: String(b.id).slice(0, 24), name: String(b.name).slice(0, 50), v: Object.fromEntries(BOARD_KEYS.filter(k => k in b.v).map(k => [k, b.v[k]])) })) : [];
      if (raw.settings) { if (PRINTERS.some(p => p.id === raw.settings.printer)) DB.settings.printer = raw.settings.printer; if (DENS[raw.settings.mat]) DB.settings.mat = raw.settings.mat; if (raw.settings.fit && typeof raw.settings.fit === 'object') DB.settings.fit = Object.fromEntries(Object.entries(raw.settings.fit).filter(([k, v]) => PRINTERS.some(p => p.id === k) && typeof v === 'number' && v >= 0 && v <= 1)); if (raw.settings.cost && typeof raw.settings.cost === 'object') { const rc = raw.settings.cost; DB.settings.cost = { infill: +rc.infill, layer: +rc.layer, walls: +rc.walls, kwh: +rc.kwh, tfix: Object.fromEntries(Object.entries(rc.tfix || {}).filter(([k, v]) => PRINTERS.some(p => p.id === k) && +v >= 0.3 && +v <= 4).map(([k, v]) => [k, +v])), kg: Object.fromEntries(Object.entries(rc.kg || {}).filter(([k, v]) => DENS[k] && isFinite(+v)).map(([k, v]) => [k, +v])) }; costCfg(); } if (raw.settings.theme === 'dark' || raw.settings.theme === 'light') { DB.settings.theme = raw.settings.theme; setTheme(raw.settings.theme, false); } }
    }
    dbLoaded = true;
  } catch (e) {
    dbLoaded = false;
    toast('Nie wczytano modeli z dysku (' + e.message + ') - zapis wyłączony, żeby niczego nie nadpisać.', 6000);
  }
}
async function boot() {
  if (window.W3D_LOCAL) {   // wersja na GitHub: zamiast WiFi - wybor folderu zapisu
    await W3D_LOCAL.ready;
    $('#btnWifi').innerHTML = '&#128193; Zapis'; $('#btnWifi').title = 'Gdzie zapisywać projekty: folder na dysku albo przeglądarka';
    $('#btnWifi').onclick = () => { if (W3D_LOCAL.mode === 'folder') { if (confirm(W3D_LOCAL.label() + '\n\nOK = wybierz inny folder\nAnuluj = zostaw')) W3D_LOCAL.chooseFolder(); } else W3D_LOCAL.chooseFolder(); };
    $('#sdBadge').title = 'Kliknij, żeby wybrać folder na dysku'; $('#sdBadge').style.cursor = 'pointer'; $('#sdBadge').onclick = () => $('#btnWifi').click();
  }
  freePanelEvents();
  await checkSd();
  await loadDb();
  $('#selPrinter').value = DB.settings.printer; $('#selMat').value = DB.settings.mat;
  const m = DB.last && DB.models[DB.last];
  if (m) { cur = { id: m.id, name: m.name, tpl: m.tpl, v: cleanVals(tplById(m.tpl), m.v) }; openCur(true); }
  else newFromTpl('shield');
  startViewer();
  setInterval(checkSd, 15000);
}
window.addEventListener('beforeunload', e => { if (cur && !cur.id && dirty) { e.preventDefault(); e.returnValue = ''; } });
boot();
